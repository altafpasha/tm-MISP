version: "3.9"

networks:
  coolify:
    external: true

services:
  misp-db:
    image: mariadb:10.6
    container_name: misp-db
    restart: unless-stopped
    platform: linux/arm64
    networks:
      - coolify
    volumes:
      - ./data/db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    platform: linux/arm64
    networks:
      - coolify
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  s3fs:
    image: codesec/s3fs:latest
    container_name: s3fs
    restart: unless-stopped
    platform: linux/arm64
    networks:
      - coolify
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    volumes:
      - ./data/s3fs-cache:/tmp/s3cache
      - s3-mount:/mnt/s3
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_URL: ${AWS_S3_URL}
    healthcheck:
      test: ["CMD", "ls", "/mnt/s3"]
      interval: 30s
      timeout: 10s
      retries: 3

  misp:
    image: codesec/misp-core:arm64
    container_name: misp
    restart: unless-stopped
    platform: linux/arm64
    networks:
      - coolify
    depends_on:
      - misp-db
      - redis
      - s3fs
    environment:
      MYSQL_HOST: misp-db
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      MISP_BASEURL: https://misp.codesec.me
      MISP_EMAIL: ${MISP_EMAIL}
      MISP_ORG: ${MISP_ORG}
      MISP_ADMIN_EMAIL: ${MISP_EMAIL}
      MISP_ADMIN_PASSPHRASE: ${MISP_ADMIN_PASSPHRASE}
    volumes:
      - s3-mount:/var/www/MISP/app/files
      - ./misp:/var/www/MISP/custom
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.misp.rule=Host(`misp.codesec.me`)
      - traefik.http.routers.misp.entrypoints=http,https
      - traefik.http.routers.misp.tls=true
      - traefik.http.routers.misp.tls.certresolver=letsencrypt
      - traefik.http.services.misp.loadbalancer.server.port=80
      
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  s3-mount:
