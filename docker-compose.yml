version: '3.8'

services:
  misp-db:
    image: mariadb:10.6
    container_name: misp-db
    restart: always
    platform: linux/arm64
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./data/db:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5

  s3fs:
    image: codesec/s3fs:latest
    container_name: s3fs
    restart: always
    platform: linux/arm64
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_URL: ${AWS_S3_URL}
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    volumes:
      - ./data/s3fs-cache:/tmp/s3cache
      - s3-mount:/mnt/s3
    healthcheck:
      test: ["CMD", "ls", "/mnt/s3"]
      interval: 30s
      timeout: 10s
      retries: 3

  misp:
    image: codesec/misp-core:arm64
    container_name: misp
    restart: always
    platform: linux/arm64
    depends_on:
      misp-db:
        condition: service_healthy
      s3fs:
        condition: service_healthy
    environment:
      MYSQL_HOST: misp-db
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MISP_BASEURL: http://localhost:8080
      MISP_EMAIL: ${MISP_EMAIL}
      MISP_ORG: ${MISP_ORG}
      MISP_ADMIN_EMAIL: ${MISP_EMAIL}
      MISP_ADMIN_PASSPHRASE: "SuperSecureAdminPass123"
    volumes:
      - s3-mount:/var/www/MISP/app/files
      - ./misp:/var/www/MISP/custom
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  s3-mount:
